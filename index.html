<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação Google - Redirecionando...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8f9fa; color: #202124; text-align: center; padding: 20px; }
    .card { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px; width: 100%; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #4285F4; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 0 auto 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; color: #3c4043; }
    p { font-size: 0.9rem; color: #70757a; line-height: 1.4; }
    .error-msg { color: #d93025; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loader">
      <div class="spinner"></div>
      <h2>Redirecionando para a avaliação...</h2>
      <p>Aguarde um instante enquanto conectamos ao Google.</p>
    </div>
    <div id="no-id-screen" style="display: none;">
      <h2>📱 Placa de Avaliação</h2>
      <p style="margin-top: 10px;">Aproxime seu celular da placa NFC ou leia o QR Code para avaliar o estabelecimento.</p>
    </div>
    <div id="error-screen" style="display: none;">
      <h2 class="error-msg">Placa não encontrada</h2>
      <p style="margin-top: 10px;">Esta placa ainda não foi ativada ou o código informado está incorreto.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zxzryewznxcbcsqmuqzl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4enJ5ZXd6bnhjYmNzcW11cXpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NjI2MDYsImV4cCI6MjEwNjUzODYwNn0.p0UZxw6A51-7IYdWJ6xxdnvZU3Plbs8miFVUBymq55I';

    async function processarRedirecionamento() {
      const urlParams = new URLSearchParams(window.location.search);
      const placaId = urlParams.get('id');

      if (!placaId) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('no-id-screen').style.display = 'block';
        return;
      }

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/placas?id=eq.${encodeURIComponent(placaId)}&select=google_review_url,ativo`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        const data = await response.json();

        if (!response.ok || !data || data.length === 0 || !data[0].ativo) {
          throw new Error('Placa inativa ou não encontrada');
        }

        window.location.href = data[0].google_review_url;
      } catch (err) {
        console.error('Erro ao redirecionar:', err);
        document.getElementById('loader').style.display = 'none';
        document.getElementById('error-screen').style.display = 'block';
      }
    }

    processarRedirecionamento();
  </script>
</body>
</html>
