<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Gestao de Placas</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f3f4; min-height: 100vh; padding: 16px; color: #202124; display: flex; justify-content: center; align-items: flex-start; }
    .container { width: 100%; max-width: 520px; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 22px; margin-top: 10px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .btn-voltar { background: #e8eaed; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; color: #3c4043; font-size: 0.85rem; }
    h2 { font-size: 1.25rem; font-weight: 700; color: #202124; }
    p.desc { font-size: 0.88rem; color: #5f6368; margin-bottom: 18px; }
    .btn-action { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background-color: #1a73e8; color: white; }
    .btn-secondary { background-color: #34a853; color: white; }
    .btn-danger { background-color: #ea4355; color: white; }
    .form-group { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: #5f6368; text-transform: uppercase; margin-bottom: 5px; }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid #dadce0; border-radius: 10px; font-size: 0.95rem; outline: none; }
    input:focus { border-color: #1a73e8; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: none; }
    .table-responsive { width: 100%; max-width: 100%; overflow-x: auto; margin-top: 10px; border: 1px solid #e8eaed; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.82rem; }
    th { background-color: #f8f9fa; padding: 10px 8px; border-bottom: 1px solid #dadce0; color: #5f6368; font-weight: 600; }
    td { padding: 10px 8px; border-bottom: 1px solid #e8eaed; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .btn-table { border: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 600; margin-right: 4px; }
    .btn-edit-id { background: #ea8600; color: white; }
    .btn-edit-url { background: #1a73e8; color: white; }
    .msg-feedback { padding: 12px; border-radius: 8px; font-size: 0.88rem; margin-top: 12px; text-align: center; display: none; }
    .msg-sucesso { background-color: #e6f4ea; color: #137333; }
    .msg-erro { background-color: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>
  <div class="container">
    <div id="screen-login">
      <h2 style="text-align: center; margin-bottom: 8px;">Acesso Restrito</h2>
      <p class="desc" style="text-align: center;">Area exclusiva do vendedor</p>
      <div class="form-group">
        <label>Senha de Acesso</label>
        <input type="password" id="admin-pass" placeholder="Digite sua senha de vendedor">
      </div>
      <button class="btn-action btn-primary" onclick="fazerLogin()">Entrar no Sistema</button>
      <div id="login-msg" class="msg-feedback msg-erro">Senha incorreta.</div>
    </div>

    <div id="screen-menu" style="display: none;">
      <h2>Painel do Vendedor</h2>
      <p class="desc">Gerenciamento e venda de plaquinhas:</p>
      <button class="btn-action btn-primary" onclick="navegarPara('cadastro')">Cadastrar Nova Venda / Placa</button>
      <button class="btn-action btn-secondary" onclick="navegarPara('planilha')">Visualizar / Editar Placas (Planilha)</button>
      <button class="btn-action btn-danger" style="margin-top: 15px; font-size: 0.85rem; padding: 10px;" onclick="fazerLogout()">Sair</button>
    </div>

    <div id="screen-cadastro" style="display: none;">
      <div class="top-bar">
        <button class="btn-voltar" onclick="voltarParaMenu()">Voltar</button>
        <h2>Nova Placa</h2>
      </div>
      <div id="reader"></div>
      <button id="btn-cam" class="btn-action btn-secondary" style="font-size: 0.88rem; padding: 10px;" onclick="iniciarScannerCamera()">Abrir Camera para Conferencia</button>
      <div class="form-group">
        <label>ID da Placa (Etiqueta do Verso)</label>
        <input type="text" id="cad-id" placeholder="Ex: 001, 002, placa_05">
      </div>
      <div class="form-group">
        <label>Nome do Estabelecimento</label>
        <input type="text" id="cad-nome" placeholder="Ex: Pizzaria Forno Nobre">
      </div>
      <div class="form-group">
        <label>Link de Avaliacao do Google</label>
        <input type="url" id="cad-url" placeholder="https://maps.app.goo.gl/...">
      </div>
      <button class="btn-action btn-primary" onclick="salvarNovaPlaca()">Salvar e Ativar no Supabase</button>
      <div id="cad-msg" class="msg-feedback"></div>
    </div>

    <div id="screen-planilha" style="display: none;">
      <div class="top-bar">
        <button class="btn-voltar" onclick="voltarParaMenu()">Voltar</button>
        <h2>Base de Clientes</h2>
      </div>
      <p class="desc">Edite o ID da etiqueta ou o link do Google:</p>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ID Dtiqueta</th>
              <th>Establecimento</th>
              <th>Acoes de Edicao</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zxzryewznxcbcsqmuqzl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpcyI6InN1cGFiYXNlIiwicmViZSI6Inp4enrlZXdueHNiY3MxYXRfbWVvIiwicm9sZSI6IkFub24iLCJpYXQiOjE3OTA5NjI7MDYsImV4cCI6MjEwNjUzODYwNn0.P0UZxw6A51-7IYdWJ6xxdnvZU3Plbs8miFVUBymq55I';
    const SENHA_ADMIN = '1234';
    let html5QrCode = null;

    function fazerLogin() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === SENHA_ADMIN) {
        document.getElementById('screen-login').style.display = 'none';
        document.getElementById('screen-menu').style.display = 'block';
      } else {
        document.getElementById('login-msg').style.display = 'block';
      }
    }

    function fazerLogout() {
      pararScannerCamera();
      document.getElementById('screen-menu').style.display = 'none';
      document.getElementById('screen-login').style.display = 'block';
      document.getElementById('admin-pass').value = '';
    }

    function navegarPara(tela) {
      document.getElementById('screen-menu').style.display = 'none';
      if (tela === 'cadastro') {
        document.getElementById('screen-cadastro').style.display = 'block';
      } else if (tela === 'planilha') {
        document.getElementById('screen-planilha').style.display = 'block';
        carregarTabelaPlacas();
      }
    }

    function voltarParaMenu() {
      pararScannerCamera();
      document.getElementById('screen-cadastro').style.display = 'none';
      document.getElementById('screen-planilha').style.display = 'none';
      document.getElementById('screen-menu').style.display = 'block';
      document.getElementById('cad-msg').style.display = 'none';
    }

    function iniciarScannerCamera() {
      const readerDiv = document.getElementById('reader');
      readerDiv.style.display = 'block';
      html5QrCode = new Html5QrCode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, q~box: {width: 200, height: 200} },
        (decodedText) => {
          alert('QRCode lido:\n' + decodedText);
          pararScannerCamera();
        },
        (errorMessage) => {}
      ).catch((err) => {
        alert("Erro na camera: " + err);
        readerDiv.style.display = 'none';
      });
    }

    function pararScannerCamera() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          document.getElementById('reader').style.display = 'none';
        }).catch(() => {});
      }
    }

    async function salvarNovaPlaca() {
      const id = document.getElementById('cad-id').value.trim();
      const nome = document.getElementById('cad-nome').value.trim();
      const url = document.getElementById('cad-url').value.trim();
      const msgBox = document.getElementById('cad-msg');

      if (!id || !nome || !url) {
        msgBox.textContent = 'Preencha o ID  nome e URL.';
        msgBox.className = 'msg-feedback msg-erro';
        msgBox.style.display = 'block';
        return;
      }

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/placas`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY]`,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify({ id: id, cliente_nome: nome, google_review_url: url, ativo: true })
        });

        if (!response.ok) throw new Error('Erro ao salvar no Supabase.');

        msgBox.textContent = `Placa "${id}" cadastrada com sucesso!`;
        msgBox.className = 'msg-feedback msg-sucesso';
        msgBox.style.display = 'block';

        document.getElementById('cad-id').value;
        document.getElementById('cad-nome').value;
        document.getElementById('cad-url').value;
      } catch (err) {
        msgBox.textContent = err.message;
        msgBox.className = 'msg-feedback msg-erro';
        msgBox.style.display = 'block';
      }
    }

    async function carregarTabelaPlacas() {
      const tbody = document.getElementById('tabela-corpo');
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:15px;">Consultando banco...</td></tr>';

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/placas?select=*forder=created_at.desc`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY]`
          }
        });
        const placas = await response.json();

        if (!response.ok) throw new Error('Falha ao listar dados.');

        if (placas.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:15px;">Nenhuma placa cadastrada.</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        placas.forEach(p => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-weight:700; color:#1a73e8;">${p.id}</td>
            <td>
              <strong>${p.cliente_nome}</strong><br>
              <span style="font-size:0.75rem; color:#70757a;">${p.google_review_url.substring(0, 25)}...</span>
            </td>
            <td>
              <button class="btn-table btn-edit-id" onclick="editarIdPlaca('${p.id}', '${p.cliente_nome}', '${p.google_review_url}')">ID</button>
              <button class="btn-table btn-edit-url" onclick="editarUrlGoogle('${p.id}', '${p.google_review_url}')">Link</button>
            </td>
          ;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="3" style="color:red; text-align:center;">Erro: ${err.message}</td></tr>`;
      }
    }

    async function editarUrlGoogle(id, urlAtual) {
      const novaUrl = prompt(`Nova URL do Google para a placa [${id}]:`, urlAtual);
      if (!novaUrl || novaUrl.trim() === '' || novaUrl === urlAtual) return;

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/placas?id=eq.${encodeURIComponent(id)}`, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ google_review_url: novaUrl.trim() })
        });

        if (!response.ok) throw new Error('Erro na atualizacao.');
        alert('URL atualizada com sucesso!');
        carregarTabelaPlacas();
      } catch (err) {
        alert('Erro: ' + err.message);
      }
    }

    async function editarIdPlaca(idAtual, nome, url) {
      const novoId = prompt(`Digite o NOVO ID  para substituir [${idAtual}]:`, idAtual);
      if (!novoId || novoId.trim() === '' || novoId === idAtual) return;

      try {
        const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/placas`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ id: novoId.trim(), cliente_nome: nome, google_review_url: url, ativo: true })
        });

        if (!insertRes.ok) throw new Error('O novo ID ja existe ou e invalido.');

        await fetch(`${SUPABASE_URL}/rest/v1/placas?id=eq.${encodeURIComponent(idAtual)}`, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        alert('ID alterado com sucesso!');
        carregarTabelaPlacas();
      } catch (err) {
        alert('Erro ao alterar ID: ' + err.message);
      }
    }
  </script>
</body>
</html>
